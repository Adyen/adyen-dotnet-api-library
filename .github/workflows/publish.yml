name: Publish to NuGet

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry-run without publishing'
        type: boolean
        default: false
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  # Publish the nuget package
  publish:
    name: Build, Pack & Publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Set up .NET 8.0
      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      # Build in Release configuration
      - name: Build Release
        run: dotnet build Adyen --configuration Release --no-restore

      # Run unit tests on .NET 8.0
      - name: Run unit tests on .NET 8.0
        run: dotnet test --configuration Release --framework net8.0 --no-restore Adyen.Test/Adyen.Test.csproj

      # Pack Release
      - name: Pack
        run: dotnet pack Adyen --no-build --configuration Release --output nuget

      # Exchange the OIDC token for a short-lived NuGet API key
      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Publish Package
      - name: Publish Nuget
        if: ${{ !inputs['dry-run'] }}
        run: dotnet nuget push nuget/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}

      - name: Dry run (skip publishing)
        if: ${{ inputs['dry-run'] }}
        run: echo "Dry run completed. Build, tests, packaging, and NuGet OIDC login succeeded. No package was published." >> "$GITHUB_STEP_SUMMARY"