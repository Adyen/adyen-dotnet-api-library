name: Integration Tests

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: integration-tests
  cancel-in-progress: false

jobs:
  integration-tests:
    name: Run Integration Tests on .NET 8.0
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: integration-tests

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up .NET 8.0
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: 8.0.x

      - name: Run integration tests
        env:
          ADYEN_API_LIBRARIES_INTEGRATION_TEST_CONFIG: ${{ secrets.ADYEN_API_LIBRARIES_INTEGRATION_TEST_CONFIG }}
        run: >
          dotnet test Adyen.IntegrationTest/Adyen.IntegrationTest.csproj
          --configuration Release
          --logger trx
          --results-directory TestResults/integration

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-test-results
          path: TestResults/integration/
          if-no-files-found: ignore
          retention-days: 7
